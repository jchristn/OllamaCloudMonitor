services:
  monitor:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
    image: ollama-cloud-monitor:0.1.0
    ports:
      - "127.0.0.1:${MONITOR_PUBLISHED_PORT:-8080}:8080"
    environment:
      OLLAMA_CLOUD_BEARER_TOKEN: ${OLLAMA_CLOUD_BEARER_TOKEN:-}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/v1.0/api/health"]
      interval: 5s
      timeout: 3s
      retries: 2
