$kind: http-request
description: Current shared account credits. Read-only. Credentials and responses are never persisted by the monitor.
url: "{{baseUrl}}/v1.0/api/balance"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Current shared account credits.resources/examples
order: 3000
